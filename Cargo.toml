[workspace]
resolver = "2"
members = ["crates/deepl-core", "crates/deepl-engine", "apps/translation-amigo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Stephen"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
