[package]
name = "amigo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "amigo"
path = "src/main.rs"

[dependencies]
deepl-core = { path = "../../crates/deepl-core" }
deepl-engine = { path = "../../crates/deepl-engine" }
# One dependency for GPUI, its platform layer and the component library. The kit
# pins the compatible gpui snapshot and mounts a Root for us.
gpui-kit = "0.8"
log = { workspace = true }
serde = { workspace = true }
